name: Deploy Frontend Prod (Docker)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: true

env:
  IMAGE_NAME_FRONTEND: ghcr.io/${{ github.repository_owner }}/revelation-frontend
  DEPLOY_DIR: /home/beingonam/revelationpestcontrol
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_SITE_URL: ""

jobs:
  deploy:
    runs-on: [self-hosted, revelation-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Frontend Env Vars
        run: |
          ENV_FILE=""
          if [ -f "/home/envs/revelationpestcontrol/.env.frontend.production" ]; then
            ENV_FILE="/home/envs/revelationpestcontrol/.env.frontend.production"
          elif [ -f "./.env.production" ]; then
            ENV_FILE="./.env.production"
          fi

          if [ -n "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ ! "$line" =~ ^# ]] && [[ "$line" =~ = ]]; then
                key=$(echo "$line" | cut -d= -f1 | tr -d ' ')
                val=$(echo "$line" | cut -d= -f2- | sed -e 's/^["'\''\s]*//' -e 's/["'\''\s]*$//')
                echo "$key=$val" >> $GITHUB_ENV
              fi
            done < "$ENV_FILE"
          else
            echo "Missing frontend environment file"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_NAME_FRONTEND }}:prod

      - name: Prepare deployment directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          install -m 644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Pull and start frontend container
        env:
          IMAGE_TAG_BACKEND: prod
          IMAGE_TAG_FRONTEND: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          cd "$DEPLOY_DIR"
          export IMAGE_TAG_BACKEND
          export IMAGE_TAG_FRONTEND
          export REPOSITORY_OWNER
          
          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi
          
          $DOCKER_COMPOSE config
          $DOCKER_COMPOSE pull revelation-frontend
          $DOCKER_COMPOSE up -d --remove-orphans revelation-frontend

      - name: Show running services
        env:
          IMAGE_TAG_BACKEND: prod
          IMAGE_TAG_FRONTEND: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          cd "$DEPLOY_DIR"
          export IMAGE_TAG_BACKEND
          export IMAGE_TAG_FRONTEND
          export REPOSITORY_OWNER
          
          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi
          
          $DOCKER_COMPOSE ps
