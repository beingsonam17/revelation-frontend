name: Deploy Frontend Prod (Docker)

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: true

env:
  IMAGE_NAME_FRONTEND: ghcr.io/${{ github.repository_owner }}/revelation-frontend
  DEPLOY_DIR: /home/beingonam/revelationpestcontrol

jobs:
  deploy:
    runs-on: [self-hosted, revelation-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Frontend Env Vars from VPS
        run: |
          ENV_FILE="/home/envs/revelation/.env.production"
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ ! "$line" =~ ^# ]] && [[ "$line" =~ = ]]; then
                key=$(echo "$line" | cut -d= -f1 | tr -d ' ')
                val=$(echo "$line" | cut -d= -f2- | sed -e 's/^["'\''\s]*//' -e 's/["'\''\s]*$//')
                echo "$key=$val" >> $GITHUB_ENV
              fi
            done < "$ENV_FILE"
          else
            echo "Missing /home/envs/revelation/.env.production"
            exit 1
          fi

      - name: Build local Docker image on VPS
        run: |
          API_URL="${NEXT_PUBLIC_API_URL:-https://api.revelationpestcontrol.com/api/v1}"
          docker build --build-arg NEXT_PUBLIC_API_URL="$API_URL" -t ghcr.io/${{ github.repository_owner }}/revelation-frontend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/revelation-frontend:prod .

      - name: Prepare deployment directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          install -m 644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Start containers
        env:
          IMAGE_TAG_BACKEND: prod
          IMAGE_TAG_FRONTEND: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          cd "$DEPLOY_DIR"
          export IMAGE_TAG_BACKEND
          export IMAGE_TAG_FRONTEND
          export REPOSITORY_OWNER
          
          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi
          
          $DOCKER_COMPOSE --env-file .env.production up -d revelation-frontend

      - name: Show running services
        env:
          IMAGE_TAG_BACKEND: prod
          IMAGE_TAG_FRONTEND: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          cd "$DEPLOY_DIR"
          export IMAGE_TAG_BACKEND
          export IMAGE_TAG_FRONTEND
          export REPOSITORY_OWNER
          
          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi
          
          $DOCKER_COMPOSE --env-file .env.production ps
